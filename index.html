 <button class="btn" onclick="gen()" ${busy?"disabled":""}>${busy?"Designing…":designs.length?"🔄 Shuffle new trending looks":"✨ Generate 3 patterns"}</button></div>
 ${designs.length?`<div class="card"><h3>Pick a pattern</h3><div class="grid">${designs.map((d,i)=>`<div class="d ${i==pick?"sel":""}" onclick="setPick(${i})">${art(style,d,i,"g"+i)}<b>${esc(d.n)}</b>${d.t?`<div class="mu">${esc(d.t)}</div>`:""}</div>`).join("")}</div>
 ${pick>=0?(staffL.length?`<hr><h3>Book your fitting</h3><div class="row"><select id="st">${staffL.map(x=>`<option value="${x.id}">${esc(x.name||"Tailor")}</option>`).join("")}</select><input type="date" id="dt" min="${today()}" value="${addDays(2)}"><button class="btn" onclick="book()">Book appointment</button></div>`:`<p class="mu">No tailors available yet — please check back soon.</p>`):""}</div>`:""}
 <h2>My orders</h2>${orders.length?orders.map(o=>orderCard(o)).join(""):`<p class="mu">No orders yet.</p>`}`}
function viewStaff(){return `<h2>Staff desk</h2>`+(orders.length?orders.map(o=>{let x="";
 if(o.status=="Booked")x=`<div class="row"><input id="m${o.id}" placeholder="Bust/Waist/Hip/Length e.g. 36/30/38/42"><input type="date" id="e${o.id}" value="${addDays(10)}"><button class="btn" onclick="meas(${o.id})">Save measurements & start</button></div>`;
 else if(o.status=="In stitching")x=`<button class="btn" onclick="adv(${o.id},'Stitched')">Mark stitching done</button>`;
 else if(o.status=="Stitched")x=`<button class="btn" onclick="adv(${o.id},'Delivered')">Mark delivered</button>`;
 return orderCard(o,x)}).join(""):`<p class="mu">No bookings assigned to you yet.</p>`)}
function viewHead(){const c=s=>orders.filter(o=>o.status==s).length;
 return `<h2>Head overview</h2><div class="grid">${FLOW.map(s=>`<div class="card"><div class="mu">${s}</div><h1>${c(s)}</h1></div>`).join("")}</div>`+
 orders.map(o=>orderCard(o,o.status!="Delivered"?`<div class="row"><select onchange="reas(${o.id},this.value)">${staffL.map(x=>`<option value="${x.id}" ${x.id==o.staff_id?"selected":""}>${esc(x.name||"Tailor")}</option>`).join("")}</select><input type="date" value="${o.eta||""}" onchange="eta(${o.id},this.value)"><span class="mu">Reassign / change delivery date</span></div>`:"")).join("")}
function render(){const a=$("app");
 if(recov){a.innerHTML=resetView();$("who").innerHTML="";$("notes").innerHTML="";return}
 if(!me){a.innerHTML=authView();$("who").innerHTML="";$("notes").innerHTML="";return}
 $("who").innerHTML=`<span class="mu">${esc(prof.name||me.phone||me.email)} · ${esc(prof.role)}</span> <button class="chip" onclick="logout()">Sign out</button>`;
 if(needName){a.innerHTML=nameView();$("notes").innerHTML="";return}
 a.innerHTML=(msg?`<p class="mu">${esc(msg)}</p>`:"")+(prof.role=="customer"?viewCustomer():prof.role=="staff"?viewStaff():viewHead());
 $("notes").innerHTML=notes.length?notes.map(x=>`<div class="n">${esc(x.text)} <span class="mu">· ${new Date(x.created_at).toLocaleString()}</span></div>`).join(""):`<p class="mu">Nothing yet.</p>`}
async function init(){if(recov)return render();const {data:{session}}=await sb.auth.getSession();me=session?session.user:null;if(!me)return render();
 const p=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
 if(p.error){msg="Database not ready: "+p.error.message;me=null;return render()}
 prof=p.data||{name:"",role:"customer"};needName=prof.role=="customer"&&!(prof.name||"").trim();await load()}
async function load(){const [s,o,n]=await Promise.all([sb.from("profiles").select("id,name,role").in("role",["staff","head"]),sb.from("orders").select("*").order("id",{ascending:false}),sb.from("notifications").select("*").eq("user_id",me.id).order("id",{ascending:false}).limit(8)]);
 const e=s.error||o.error||n.error;msg=e?e.message:"";
 const pr=s.data||[];staffL=pr.filter(x=>x.role=="staff");heads=pr.filter(x=>x.role=="head").map(x=>x.id);
 orders=(o.data||[]).map(x=>({...x,svg:renderOrder(x)}));notes=n.data||[];render()}
async function logout(){await sb.auth.signOut();me=prof=null;orders=[];notes=[];designs=[];pick=-1;msg="";am="in";needName=false;render()}
async function notify(ids,text){const rows=[...new Set(ids.filter(Boolean))].map(u=>({user_id:u,text}));if(rows.length)await sb.from("notifications").insert(rows)}
async function book(){const d=designs[pick],st=$("st").value,dt=$("dt").value,who=prof.name||me.phone||me.email;
 const r=await sb.from("orders").insert({customer_name:who,customer_phone:(me.user_metadata&&me.user_metadata.phone_no)||prof.phone||(me.phone?"+"+me.phone.replace(/^\+/,""):""),staff_id:st,design:d.n,style,note:d.t||"",visit_date:dt,fabric:fabric||null,design_json:{style,i:pick,d,pal}}).select().single();
 if(r.error)return alert(r.error.message);
 await notify([me.id],`Appointment confirmed with ${nm(st)} on ${dt} for #${r.data.id} ${d.n}.`);
 await notify([st,...heads],`New booking #${r.data.id} (${who}) – ${d.n}, visit ${dt}.`);designs=[];pick=-1;await load()}
const G=id=>orders.find(o=>o.id==id);
async function upd(id,patch,text,extra){const o=G(id),r=await sb.from("orders").update(patch).eq("id",id);if(r.error)return alert(r.error.message);
 await notify([o.customer_id],text);if(extra)await notify(heads,extra);await load()}
function meas(id){const m=$("m"+id).value.trim(),e=$("e"+id).value;if(!m||!e)return alert("Enter measurements and delivery date");
 upd(id,{measurements:m,eta:e,status:"In stitching"},`Measurements taken. #${id} is in stitching. Estimated delivery: ${e}.`,`#${id} started stitching. ETA ${e}.`)}
const adv=(id,s)=>upd(id,{status:s},s=="Stitched"?`#${id} stitching complete! Ready for final pickup/delivery.`:`#${id} delivered. Thank you for choosing Diva Designer Boutique!`,`#${id} marked ${s}.`);
const eta=(id,v)=>upd(id,{eta:v||null},`Delivery date for #${id} updated to ${v}.`);
async function reas(id,v){const o=G(id),r=await sb.from("orders").update({staff_id:v}).eq("id",id);if(r.error)return alert(r.error.message);
 await notify([v],`Order #${id} assigned to you.`);await notify([o.customer_id],`Your order #${id} is now handled by ${nm(v)}.`);await load()}
function setStyle(v){style=v;designs=[];pick=-1;render()}function setPick(i){pick=i;render()}
function rmFab(){fabric="";pal=[...DP];designs=[];pick=-1;render()}
function gen(){busy=true;pick=-1;render();setTimeout(()=>{busy=false;designs=style=="blouse"?trends():STYLES[style].map(n=>({n}));render()},1200)}
function upl(el){const f=el.files[0];if(!f)return;if(f.size>15e6)return alert("Please choose a photo under 15 MB.");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d"),z=Math.min(im.width,im.height);
 if(Math.abs(im.width/im.height-1)>.2)alert("Tip: a square 6×6 inch photo works best — we cropped yours to the centre.");
 x.drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,160,160);fabric=c.toDataURL("image/jpeg",.7);
 try{const p=x.getImageData(0,0,160,160).data;let r=0,g=0,b=0,n=0;for(let i=0;i<p.length;i+=16){r+=p[i];g+=p[i+1];b+=p[i+2];n++}r/=n;g/=n;b/=n;pal=["#c9a24b","rgb("+(255-r|0)+","+(255-g|0)+","+(255-b|0)+")",(r+g+b)/3>140?"#3b2a2a":"#f3e6c8"]}catch(e){}
 designs=[];render()};im.src=r.result};r.readAsDataURL(f)}
sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){recov=true;render()}});init();setInterval(()=>{if(me&&!recov&&!(prof.role=="customer"&&designs.length)&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))load()},30000);
</script></body></html>
